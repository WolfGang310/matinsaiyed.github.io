name: Update Troy Testing Google rating

# Refreshes troytesting/rating.json (and the JSON-LD aggregateRating) from the
# real Google Business Profile once a day. Requires two repo settings:
#   • Secret   GOOGLE_MAPS_API_KEY  — a Google Cloud key with the Places API enabled
#   • Variable TROY_PLACE_ID        — the Google Place ID of the listing
# Until those are set the job is a safe no-op. Runs against the gh-pages branch
# (where the site lives) and commits back to it.

on:
  schedule:
    - cron: '17 7 * * *'   # daily, ~07:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rating:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch rating -> rating.json + JSON-LD
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          TROY_PLACE_ID: ${{ vars.TROY_PLACE_ID }}
        run: node troytesting/scripts/update-rating.mjs
      - name: Commit & push if changed
        run: |
          git config user.name "troy-rating-bot"
          git config user.email "actions@users.noreply.github.com"
          git add troytesting/rating.json troytesting/index.html || true
          if git diff --cached --quiet; then
            echo "No rating change."
          else
            git commit -m "chore(troytesting): refresh Google rating [skip ci]"
            git push origin HEAD:gh-pages
          fi
