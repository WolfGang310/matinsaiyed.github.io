# Keeps the free-tier Supabase project (test-center-scheduler) from auto-pausing.
# Free projects pause after ~7 days without API activity; when paused, the
# scheduler app silently degrades to its offline/demo fallback and the public
# Troy Testing site falls back to static content. A tiny read every 3 days
# counts as activity and keeps everything live.
#
# The key below is the PUBLIC (publishable/anon) key — safe to commit; it only
# grants what row-level security allows anonymous users anyway.
name: Supabase keep-alive
on:
  schedule:
    - cron: '17 6 */3 * *'   # every 3 days at 06:17 UTC
  workflow_dispatch: {}       # allow manual runs from the Actions tab
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database (read one public row)
        run: |
          set -e
          KEY="sb_publishable_iz7Rbg2pVJSBBIfMt6gXNw_CddgML0Z"
          CODE=$(curl -s -o /tmp/body -w "%{http_code}" \
            "https://igfchvbzmvfveecivswb.supabase.co/rest/v1/website_content?select=key&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "HTTP $CODE"; cat /tmp/body
          # 200 = alive. Anything else (incl. 5xx while paused) fails the job
          # so it shows red in the Actions tab and you notice.
          [ "$CODE" = "200" ]
