  <!-- Privacy-friendly analytics hook. troyTrack() is called on every provider hand-off.

  <script>
    window.troyTrack = function (event, props) {
      try {
        if (window.plausible) window.plausible(event, { props: props || {} });
        else if (window.gtag) window.gtag('event', event, props || {});
      } catch (e) { /* analytics must never break the page */ }
    };
  </script>
