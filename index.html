    <!-- Back-to-top — the page is ~15k px tall; appears after the hero scrolls
         out. Bottom-left to stay clear of the app's right-edge section rail. -->
    <button id="back-to-top" aria-label="Back to top" title="Back to top">↑</button>
    <style>
      #back-to-top {
        position: fixed;
        left: 22px;
        bottom: 22px;
        z-index: 60;
        width: 44px;
        height: 44px;
        border: 1px solid rgba(220, 38, 38, 0.5);
        border-radius: 9999px;
        background: rgba(10, 10, 10, 0.85);
        color: #dc2626;
        font-size: 20px;
        line-height: 1;
        cursor: pointer;
        opacity: 0;
        pointer-events: none;
        transform: translateY(8px);
        transition: opacity 250ms ease, transform 250ms ease, background 150ms ease;
        backdrop-filter: blur(6px);
      }
      #back-to-top.visible {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
      }
      #back-to-top:hover { background: #dc2626; color: #fff; }
      @media (max-width: 767px) {
        #back-to-top { left: 14px; bottom: 14px; width: 40px; height: 40px; }
      }
    </style>
    <script>
      (function () {
        var btn = document.getElementById('back-to-top');
        var ticking = false;
        function update() {
          btn.classList.toggle('visible', window.scrollY > window.innerHeight);
          ticking = false;
        }
        window.addEventListener('scroll', function () {
          if (!ticking) { ticking = true; requestAnimationFrame(update); }
        }, { passive: true });
        btn.addEventListener('click', function () {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      })();
    </script>
  </body>
